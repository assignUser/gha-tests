name: Masking Values

on:
  push:
    paths:
      - .github/workflows/masking_values.yml
  workflow_dispatch: {}

permissions: {}

jobs:
  masking_values:
    runs-on: ubuntu-latest
    steps:
      - name: Masking Secret Values
        env:
          SECRET_TOKEN: shp_123456
        run: |
          echo "Masking the secret value 'shp_78910'"
          echo "::add-mask::shp_78910"
          echo "Value is masked immediatly: shp_78910"

          echo "Masking the envvar SECRET_TOKEN"
          echo "::add-mask::SECRET_TOKEN"
          echo "This mask only takes effect in the next step: $SECRET_TOKEN"
      - run: |
          echo "Envvar name and value will be masked now: SECRET_TOKEN = $SECRET_TOKEN"
        env:
          SECRET_TOKEN: shp_123456
